<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Floks</title>
    <meta name="description" content="Welcome to the Barn — connect your wallet." />

    <!-- Open Graph — what Discord, Telegram, iMessage, Facebook, etc. read
         when someone pastes this link. All four of these need to be present
         together for most platforms to actually render a preview at all;
         the image alone usually isn't enough. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Floks" />
    <meta property="og:description" content="Welcome to the Barn — connect your wallet." />
    <meta property="og:image" content="https://floks.fun/Background.png" />
    <meta property="og:url" content="https://floks.fun" />

    <!-- Twitter/X reads its own separate set of tags, not the Open Graph
         ones above — summary_large_image is what makes it show the big
         image instead of a small thumbnail next to the text. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Floks" />
    <meta name="twitter:description" content="Welcome to the Barn — connect your wallet." />
    <meta name="twitter:image" content="https://floks.fun/Background.png" />

    <link rel="icon" type="image/jpeg" href="https://kkhttmjvokztlcttfbcy.supabase.co/storage/v1/object/public/Floks/Logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
